<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d68ad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d68ad'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EH%C3%B3a%3C/text%3E%3C/svg%3E">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-appearance:none;appearance:none}
[hidden]{display:none!important}
</style>
<title>Lab Ôn Tập Hoá 12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: một cột hẹp như trang sổ thí nghiệm; menu là các ô kiểu bảng tuần hoàn. Màu lấy từ hoá học trong bài: xanh lam CuSO₄ là màu nhấn, đỏ gạch Cu₂O báo sai, xanh lục báo đúng. */
:root{
  --paper:#eef3f6; --card:#ffffff; --ink:#132430; --muted:#566974; --line:#d1dce2;
  --cu:#1d68ad; --cu-soft:#dbe9f6; --brick:#b0442a; --brick-soft:#f7e1da; --ok:#2b8552; --ok-soft:#dcf0e3; --silver:#e4eaee;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1920; --card:#15232c; --ink:#e3ecf1; --muted:#93a6b1; --line:#26363f;
  --cu:#62aef0; --cu-soft:#183247; --brick:#e5795e; --brick-soft:#3a211b; --ok:#5fc78e; --ok-soft:#173326; --silver:#1c2c36; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1920; --card:#15232c; --ink:#e3ecf1; --muted:#93a6b1; --line:#26363f;
  --cu:#62aef0; --cu-soft:#183247; --brick:#e5795e; --brick-soft:#3a211b; --ok:#5fc78e; --ok-soft:#173326; --silver:#1c2c36; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);max-width:60ch}
.total{font-variant-numeric:tabular-nums;font-weight:700;color:var(--cu);font-size:14px;border:1.5px solid var(--cu);padding:4px 10px;border-radius:999px;white-space:nowrap}

/* menu tiles */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:10px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:150px;transition:transform .12s, box-shadow .12s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--cu)}
.tile .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.tile .sym{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;margin-top:6px;color:var(--cu)}
.tile .nm{font-weight:700;font-size:15px;line-height:1.25;margin-top:auto}
.tile .ds{font-size:12.5px;color:var(--muted);line-height:1.35}
.stars{letter-spacing:2px;font-size:14px;color:var(--line)}
.stars b{color:#d9a21b;font-weight:400}

/* game panel */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{background:none;border:none;color:var(--muted);padding:4px 0;font-size:14px}
.back:hover{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{font-size:13px;font-weight:600;background:var(--silver);padding:3px 10px;border-radius:999px}
.chip.hot{background:var(--cu-soft);color:var(--cu)}
.progress{height:6px;background:var(--silver);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--cu);transition:width .3s}
.timer i{background:var(--ok)}
.timer.low i{background:var(--brick)}
.q{font-size:19px;font-weight:600;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;font-weight:500;min-height:52px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--cu)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--brick-soft);border-color:var(--brick)}
.opt .k{display:inline-block;width:22px;font-weight:700;color:var(--muted)}
.fb{border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.5}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.no{background:var(--brick-soft);border-left:4px solid var(--brick)}
.fb b{display:block;margin-bottom:2px}
.primary{background:var(--cu);color:#fff;border:none;border-radius:8px;padding:12px 20px;font-weight:700;align-self:flex-start}
:root[data-theme="dark"] .primary{color:#08131a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#08131a}}
.primary:hover{filter:brightness(1.08)}
.ghost{background:none;border:1.5px solid var(--line);border-radius:8px;padding:11px 18px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* true/false */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfb{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:18px;font-family:var(--f-display);font-weight:800;font-size:24px}
.tfb.t{color:var(--ok)} .tfb.f{color:var(--brick)}
.tfb.t:hover{border-color:var(--ok)} .tfb.f:hover{border-color:var(--brick)}
.stmt{font-size:20px;font-weight:600;min-height:3.2em;display:flex;align-items:center}
.flash-ok{animation:fo .35s} .flash-no{animation:fn .35s}
@keyframes fo{0%{background:var(--ok-soft)}100%{background:var(--card)}}
@keyframes fn{0%{background:var(--brick-soft)}100%{background:var(--card)}}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;font-weight:500;font-size:15px;min-height:48px;overflow-wrap:anywhere}
.mi.sel{border-color:var(--cu);background:var(--cu-soft)}
.mi.done{opacity:.35;border-style:dashed;cursor:default}
.mi.bad{animation:shake .3s;border-color:var(--brick)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* sort */
.specimen{align-self:center;font-size:24px;font-weight:700;background:var(--paper);border:2px dashed var(--cu);border-radius:10px;padding:16px 26px;text-align:center;max-width:100%;overflow-wrap:anywhere}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bin{border:2px solid var(--ink);border-top-width:6px;border-radius:4px 4px 12px 12px;background:var(--card);padding:14px 10px;font-weight:700;min-height:70px}
.bin:hover{background:var(--cu-soft)}
.bin small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}

/* mystery */
.tube{display:flex;gap:16px;align-items:flex-start}
.tube svg{flex:none}
.clues{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.clue{background:var(--paper);border-left:4px solid var(--cu);padding:8px 12px;border-radius:0 6px 6px 0;font-size:15.5px}
.clue.locked{border-left-color:var(--line);color:var(--muted);font-style:italic}

/* equation */
.eq{font-size:21px;font-weight:600;background:var(--paper);border-radius:8px;padding:16px;overflow-x:auto;white-space:nowrap}
.eq .cond{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px;white-space:normal}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--cu);color:var(--cu);text-align:center;padding:0 6px}
.blank.no{color:var(--brick);border-color:var(--brick)}

/* set picker + result */
.sets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.set{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left}
.set:hover{border-color:var(--cu)}
.set b{display:block}
.set span{font-size:13px;color:var(--muted)}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:56px;color:var(--cu);line-height:1;font-variant-numeric:tabular-nums}
.bigstars{font-size:34px;letter-spacing:6px;color:var(--line)} .bigstars b{color:#d9a21b;font-weight:400}
.review{text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.review h3{font-size:17px}
.rv{background:var(--brick-soft);border-radius:8px;padding:10px 12px;font-size:14.5px}
.rv i{font-style:normal;color:var(--muted);display:block;font-size:13.5px;margin-top:2px}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.mebar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.linkbtn{background:none;border:none;color:var(--cu);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.lbbtn{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:12px 16px;font-weight:700;font-size:16px;align-self:flex-start}
.lbbtn:hover{filter:brightness(1.15)}
.lbwrap{overflow-x:auto}
.stsum{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.stsum span{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.lbt td.no,.lbt tr.none td{color:var(--muted)}
.lbt td.tt{color:var(--muted);width:2em}
.lbt .mc{text-align:center;font-size:13px}

.lbt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.lbt th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px;border-bottom:2px solid var(--ink)}
.lbt td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.lbt .r{text-align:right;white-space:nowrap}
.lbt .rk{font-family:var(--f-display);font-weight:800;font-size:18px;width:40px;color:var(--muted)}
.lbt tr.top1 .rk{color:#c9921a}.lbt tr.top2 .rk{color:#8c99a3}.lbt tr.top3 .rk{color:#b06a3b}
.lbt tr.mine td{background:var(--cu-soft)}
.lbt .nm{font-weight:600;overflow-wrap:anywhere}
.lbt .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.form{display:flex;flex-direction:column;gap:12px;max-width:420px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.field input,.field select,select.inp{font:inherit;font-weight:500;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.field input:focus,.field select:focus,select.inp:focus{outline:2px solid var(--cu);border-color:var(--cu)}
.note{font-size:14px;color:var(--muted)}
.note.ok{color:var(--ok)}.note.no{color:var(--brick)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
code{background:var(--silver);padding:1px 6px;border-radius:4px;font-size:.92em;overflow-wrap:anywhere}
.sharebox{background:var(--paper);border:1.5px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere}
@media (hover:none){.tile:hover{transform:none;box-shadow:none}.bin:hover{background:var(--card)}.opt:hover:not(:disabled),.set:hover,.tfb.t:hover,.tfb.f:hover{border-color:var(--line)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
(function(){
// ---------- helpers ----------
const SUB={0:'₀',1:'₁',2:'₂',3:'₃',4:'₄',5:'₅',6:'₆',7:'₇',8:'₈',9:'₉'};
const f=s=>String(s).replace(/([A-Za-z\)\]])(\d+)/g,(m,a,d)=>a+d.replace(/\d/g,x=>SUB[x]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById('app');
const store={get(k,d){try{const v=localStorage.getItem('hoa12:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('hoa12:'+k,JSON.stringify(v))}catch(e){}}};
const starsOf=p=>p>=.9?3:p>=.7?2:p>=.5?1:0;
const starHTML=(n,cls='stars')=>`<span class="${cls}">${'<b>★</b>'.repeat(n)}${'★'.repeat(3-n)}</span>`;
let timerId=null; const stopTimer=()=>{if(timerId){clearInterval(timerId);timerId=null}};

// ---------- data ----------
const MCQ=[
{q:'Chất nào sau đây thuộc loại ester?',a:'HCOOCH3',w:['CH3CHO','CH3OH','CH3COOH'],e:'Ester có dạng RCOOR′. HCOOCH3 là methyl formate.'},
{q:'Tên gọi của CH3COOC2H5 là',a:'ethyl acetate',w:['methyl acetate','ethyl propionate','methyl propionate'],e:'Gốc R′ (C2H5 = ethyl) + gốc acid (CH3COO = acetate).'},
{q:'Công thức của ethyl formate là',a:'HCOOC2H5',w:['CH3COOC2H5','HCOOCH3','CH3COOCH3'],e:'Formate là HCOO–, ethyl là C2H5.'},
{q:'Công thức của methyl propionate là',a:'C2H5COOCH3',w:['CH3COOC2H5','HCOOC3H7','CH3COOCH3'],e:'Propionate là C2H5COO–, methyl là CH3.'},
{q:'Trong các chất HCOOCH3, CH3COOCH3, C2H5OH, CH3COOH, chất có nhiệt độ sôi cao nhất là',a:'CH3COOH',w:['HCOOCH3','CH3COOCH3','C2H5OH'],e:'Acid tạo liên kết hydrogen bền nhất: CH3COOH sôi ở 118 °C.'},
{q:'Ester có nhiệt độ sôi thấp hơn alcohol có phân tử khối tương đương vì',a:'ester không tạo liên kết hydrogen giữa các phân tử',w:['ester có phân tử khối nhỏ hơn','ester tan tốt trong nước','ester có mạch carbon phân nhánh'],e:'Phân tử ester không có nhóm –OH nên không tạo liên kết hydrogen với nhau.'},
{q:'Thuỷ phân ester trong môi trường kiềm còn được gọi là phản ứng',a:'xà phòng hoá',w:['ester hoá','hydrogen hoá','oxi hoá'],e:'Phản ứng một chiều, tạo muối và alcohol.'},
{q:'Thuỷ phân CH3COOC2H5 trong dung dịch NaOH, đun nóng, thu được',a:'CH3COONa và C2H5OH',w:['CH3COOH và C2H5OH','C2H5COONa và CH3OH','CH3COONa và CH3OH'],e:'CH3COOC2H5 + NaOH → CH3COONa + C2H5OH.'},
{q:'Lipid có tính chất chung là',a:'không tan trong nước, tan trong dung môi hữu cơ không phân cực',w:['tan tốt trong nước','đều là chất rắn ở điều kiện thường','đều chứa nitrogen'],e:'Đây là đặc điểm chung của mọi lipid.'},
{q:'Acid béo thường có mạch carbon',a:'không phân nhánh, số C chẵn',w:['phân nhánh, số C chẵn','vòng, số C chẵn','phân nhánh, số C lẻ'],e:'Thường từ 12 đến 24 nguyên tử C.'},
{q:'Công thức của triolein là',a:'(C17H33COO)3C3H5',w:['(C17H35COO)3C3H5','(C15H31COO)3C3H5','(C17H31COO)3C3H5'],e:'Oleic acid là C17H33COOH (có 1 liên kết C=C).'},
{q:'Phân tử khối của tristearin là',a:'890',w:['884','806','878'],e:'(C17H35COO)3C3H5 có M = 890.'},
{q:'Dầu mỡ để lâu có mùi khó chịu chủ yếu do bị',a:'oxi hoá',w:['thuỷ phân','xà phòng hoá','hydrogen hoá'],e:'Liên kết C=C trong gốc acid béo bị O2 không khí oxi hoá.'},
{q:'Thêm dung dịch NaCl bão hoà sau phản ứng xà phòng hoá nhằm',a:'giảm độ tan của muối acid béo, giúp xà phòng tách ra và nổi lên',w:['làm phản ứng xảy ra nhanh hơn','trung hoà NaOH dư','kết tủa glycerol'],e:'Muối acid béo ít tan trong dung dịch NaCl đặc nên tách lớp.'},
{q:'Chất nào được dùng làm chất giặt rửa tổng hợp?',a:'CH3[CH2]11OSO3Na',w:['CH3[CH2]12COOCH3','CH3COONa','CH3[CH2]12COONa'],e:'Sodium alkyl sulfate là chất giặt rửa tổng hợp. CH3[CH2]12COONa là xà phòng.'},
{q:'Điểm chung của xà phòng và chất giặt rửa tổng hợp là',a:'phân tử có đầu ưa nước và đuôi kị nước',w:['đều dễ phân huỷ sinh học','đều giặt tốt trong nước cứng','đều điều chế từ chất béo'],e:'Cấu tạo này giúp chúng làm sạch vết bẩn dầu mỡ.'},
{q:'Carbohydrate chiếm khoảng 40% mật ong, tạo vị ngọt sắc là',a:'fructose',w:['saccharose','glucose','tinh bột'],e:'Fructose có nhiều nhất trong mật ong.'},
{q:'Carbohydrate chiếm khoảng 90% khối lượng sợi bông là',a:'cellulose',w:['tinh bột','saccharose','maltose'],e:'Bông gần như là cellulose nguyên chất.'},
{q:'Chất có nhiều trong cây mía, hoa thốt nốt, củ cải đường là',a:'saccharose',w:['glucose','fructose','maltose'],e:'Đường kính (đường ăn) chính là saccharose.'},
{q:'Ở dạng mạch hở, phân tử glucose có',a:'5 nhóm –OH và 1 nhóm –CHO',w:['4 nhóm –OH và 1 nhóm –CHO','5 nhóm –OH và 1 nhóm C=O ketone','4 nhóm –OH và 1 nhóm C=O ketone'],e:'Glucose là polyhydroxy aldehyde.'},

function shell(mode,inner,chips=''){
  return `<div class="panel" id="panel">
    <div class="bar"><button class="back" id="back">← Về menu</button><div class="chips">${chips}</div></div>
    <h2>${mode.name}</h2>${inner}</div>`;
}
function bindBack(){const b=document.getElementById('back');if(b)b.onclick=menu}

function finish(modeId,correct,total,extra,mistakes){
  stopTimer();
  const mode=MODES.find(m=>m.id===modeId);
  const pct=total?correct/total:0, st=starsOf(pct);
  const best=store.get('best',{}); const isNew=st>(best[modeId]||0);
  if(isNew){best[modeId]=st;store.set('best',best)}
  const msg=st===3?'Xuất sắc! Bạn nắm rất chắc phần này.':st===2?'Khá tốt. Xem lại các lỗi bên dưới.':st===1?'Tạm ổn. Nên ôn lại phần này.':'Cần ôn lại kĩ phần này.';
  app.innerHTML=shell(mode,`<div class="result">
    <div class="big">${correct}/${total}</div>
    ${starHTML(st,'bigstars')}
    <p>${msg}${isNew?' <b>Kỉ lục mới!</b>':''}</p>
    ${extra?`<p class="lead">${extra}</p>`:''}
    <p class="note" id="sendst"></p>
    <div class="row" style="justify-content:center"><button class="primary" id="again">Chơi lại</button><button class="ghost" id="tomenu">Chọn trò khác</button></div>
    ${mistakes&&mistakes.length?`<div class="review"><h3>Các câu cần xem lại</h3>${mistakes.map(x=>`<div class="rv">${f(x.q)}<i>${f(x.e)}</i></div>`).join('')}</div>`:''}
  </div>`);
  bindBack();
  document.getElementById('again').onclick=()=>START[modeId]();
  document.getElementById('tomenu').onclick=menu;
  const stEl=document.getElementById('sendst');
  if(sheetUrl()&&player()){stEl.textContent='Đang gửi điểm lên bảng xếp hạng…';
    submit(modeId,correct,total).then(r=>{if(!document.body.contains(stEl))return;
      if(r==='sent'){stEl.textContent='Đã lưu điểm lên bảng xếp hạng lớp.';stEl.className='note ok'}
      else{stEl.textContent='Chưa gửi được điểm (có thể do mất mạng). Điểm sẽ tự gửi lại ở lần mở game sau.';stEl.className='note no'}});}
  else if(sheetUrl()){stEl.innerHTML='Điểm lượt này chưa được lưu vì bạn chưa nhập tên. <button class="linkbtn" id="nm2">Nhập tên</button>';
    document.getElementById('nm2').onclick=()=>askName(menu);}
}

// ---------- MCQ ----------
function playMCQ(){
  const mode=MODES[0]; const qs=shuffle(MCQ).slice(0,10);
  let i=0,score=0,correct=0,streak=0; const miss=[];
  const T=20;
  function render(){
    stopTimer();
    const q=qs[i]; const opts=shuffle([q.a,...q.w]); let left=T;
    app.innerHTML=shell(mode,`
      <div class="progress"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="progress timer" id="tm"><i style="width:100%"></i></div>
      <p class="q">${i+1}. ${f(q.q)}</p>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-v="${encodeURIComponent(o)}"><span class="k">${'ABCD'[k]}</span>${f(o)}</button>`).join('')}</div>
      <div id="fb"></div>`,
      `<span class="chip">Câu ${i+1}/${qs.length}</span><span class="chip hot">${score} điểm</span>${streak>1?`<span class="chip">Chuỗi ${streak}</span>`:''}`);
    bindBack();
    const tm=document.getElementById('tm');
    timerId=setInterval(()=>{left-=.1;tm.firstElementChild.style.width=Math.max(0,left/T*100)+'%';tm.classList.toggle('low',left<6);if(left<=0)answer(null)},100);
    let t0=Date.now();
    function answer(v){
      stopTimer();
      const ok=v===q.a;
      app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const bv=decodeURIComponent(b.dataset.v);if(bv===q.a)b.classList.add('right');else if(bv===v)b.classList.add('wrong')});
      if(ok){correct++;streak++;const bonus=Math.round(Math.max(0,T-(Date.now()-t0)/1000)*5);score+=100+bonus+(streak>=3?20:0)}
      else{streak=0;miss.push({q:q.q,e:'Đáp án: '+q.a+'. '+q.e})}
      document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Chính xác!':v===null?'Hết giờ!':'Chưa đúng.'}</b>${f(q.e)}</div>
        <div style="margin-top:12px"><button class="primary" id="nx">${i+1<qs.length?'Câu tiếp':'Xem kết quả'}</button></div>`;
      document.getElementById('nx').onclick=()=>{i++;i<qs.length?render():finish('mcq',correct,qs.length,`Tổng điểm: ${score}`,miss)};
      document.getElementById('nx').focus();
    }
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(decodeURIComponent(b.dataset.v)));
  }
  render();
}

// ---------- True/False blitz ----------
function playTF(){
  const mode=MODES[1]; let pool=shuffle(TF); let i=0,correct=0,answered=0,streak=0,left=60; const miss=[];
  app.innerHTML=shell(mode,`
    <div class="progress timer" id="tm"><i style="width:100%"></i></div>
    <p class="stmt" id="st"></p>
    <div class="tf"><button class="tfb t" id="bt">ĐÚNG</button><button class="tfb f" id="bf">SAI</button></div>
    <p class="foot">Phím tắt: ← Đúng, → Sai</p>`,`<span class="chip" id="cl">60 giây</span><span class="chip hot" id="cs">0 đúng</span>`);
  bindBack();
  const st=document.getElementById('st'),tm=document.getElementById('tm'),panel=document.getElementById('panel');
  const show=()=>{if(i>=pool.length){pool=pool.concat(shuffle(TF));}st.innerHTML=f(pool[i].s)};
  show();
  function ans(v){
    if(left<=0)return;
    const it=pool[i]; const ok=(v===!!it.t); answered++;
    if(ok){correct++;streak++}else{streak=0;if(!miss.find(m=>m.q===it.s))miss.push({q:it.s,e:(it.t?'Đúng. ':'Sai. ')+it.e})}
    panel.classList.remove('flash-ok','flash-no');void panel.offsetWidth;panel.classList.add(ok?'flash-ok':'flash-no');
    document.getElementById('cs').textContent=correct+' đúng'+(streak>2?' · chuỗi '+streak:'');
    i++;show();
  }
  document.getElementById('bt').onclick=()=>ans(true);
  document.getElementById('bf').onclick=()=>ans(false);
  const key=e=>{if(!document.getElementById('bt')){document.removeEventListener('keydown',key);return}if(e.key==='ArrowLeft')ans(true);if(e.key==='ArrowRight')ans(false)};
  document.addEventListener('keydown',key);
  timerId=setInterval(()=>{left-=.1;tm.firstElementChild.style.width=Math.max(0,left/60*100)+'%';tm.classList.toggle('low',left<10);
    document.getElementById('cl').textContent=Math.ceil(Math.max(0,left))+' giây';
    if(left<=0){document.removeEventListener('keydown',key);finish('tf',correct,Math.max(answered,1),`Bạn trả lời ${answered} nhận định trong 60 giây.`,miss)}},100);
}

// ---------- Match ----------
function playMatch(k){
  const mode=MODES[2]; const set=MATCH[k];
  const L=shuffle(set.pairs.map((p,i)=>({t:p[0],i}))), R=shuffle(set.pairs.map((p,i)=>({t:p[1],i})));
  let sel=null,done=0,misses=0; const t0=Date.now(); const missList=[];
  app.innerHTML=shell(mode,`<p class="lead">${set.name}</p>
    <div class="match"><div class="col">${L.map(x=>`<button class="mi" data-s="L" data-i="${x.i}">${f(x.t)}</button>`).join('')}</div>
    <div class="col">${R.map(x=>`<button class="mi" data-s="R" data-i="${x.i}">${f(x.t)}</button>`).join('')}</div></div>`,
    `<span class="chip hot" id="mc">0/${set.pairs.length} cặp</span><span class="chip" id="mm">0 lần sai</span>`);
  bindBack();
  app.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('done'))return;
    if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
    if(sel.dataset.i===b.dataset.i){sel.classList.add('done');b.classList.add('done');sel.classList.remove('sel');sel.disabled=b.disabled=true;sel=null;done++;
      document.getElementById('mc').textContent=`${done}/${set.pairs.length} cặp`;
      if(done===set.pairs.length){const sec=Math.round((Date.now()-t0)/1000);
        setTimeout(()=>finish('match',Math.max(0,set.pairs.length-misses),set.pairs.length,`Hoàn thành trong ${sec} giây với ${misses} lần ghép sai. Mỗi lần sai bị trừ 1 cặp.`,missList),350)}}
    else{misses++;const a=sel,lt=a.dataset.s==='L'?a:b;const p=set.pairs[+lt.dataset.i];
      if(!missList.find(m=>m.q===p[0]))missList.push({q:p[0],e:'Đáp án đúng: '+p[1]});
      document.getElementById('mm').textContent=misses+' lần sai';
      [a,b].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')});a.classList.remove('sel');sel=null}
  });
}

// ---------- Sort ----------
function playSort(k){
  const mode=MODES[3]; const set=SORT[k]; const items=shuffle(set.items); let i=0,correct=0; const miss=[];
  const counts=set.bins.map(()=>0);
  function render(fb){
    app.innerHTML=shell(mode,`<p class="lead">${set.name}</p>
      <div class="progress"><i style="width:${i/items.length*100}%"></i></div>
      <div class="specimen">${i<items.length?f(items[i][0]):''}</div>
      <div class="bins">${set.bins.map((b,j)=>`<button class="bin" data-j="${j}">${b}<small>${counts[j]} chất</small></button>`).join('')}</div>
      <div id="fb">${fb||''}</div>`,`<span class="chip">${Math.min(i+1,items.length)}/${items.length}</span><span class="chip hot">${correct} đúng</span>`);
    bindBack();
    app.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{
      const it=items[i]; const j=+b.dataset.j; const ok=j===it[1]; counts[it[1]]++;
      if(ok)correct++;else miss.push({q:it[0],e:'Thuộc nhóm: '+set.bins[it[1]]});
      const fbh=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Đúng nhóm!':'Chưa đúng.'}</b>${f(it[0])} thuộc nhóm “${set.bins[it[1]]}”.</div>`;
      i++; if(i<items.length)render(fbh);else finish('sort',correct,items.length,'',miss);
    });
  }
  render();
}

// ---------- Mystery tube ----------
function playMys(){
  const mode=MODES[4]; const cases=shuffle(MYS).slice(0,6); let n=0,pts=0,correct=0; const miss=[];
  const tubeSVG=lvl=>{const colors=['var(--silver)','var(--cu-soft)','var(--cu)','var(--cu)'];return `<svg width="54" height="150" viewBox="0 0 54 150" aria-hidden="true">
    <rect x="4" y="2" width="46" height="8" rx="3" fill="var(--line)"/>
    <path d="M10 10 V120 a17 17 0 0 0 34 0 V10" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>
    <path d="M12 ${118-lvl*24} V120 a15 15 0 0 0 30 0 V${118-lvl*24} Z" fill="${colors[lvl]}" opacity=".85"/>
    <text x="27" y="${108}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)" font-family="var(--f-display)">?</text></svg>`};
  function render(){
    const c=cases[n]; let shown=1; const opts=shuffle(c.o);
    function draw(fb){
      app.innerHTML=shell(mode,`
        <div class="progress"><i style="width:${n/cases.length*100}%"></i></div>
        <div class="tube">${tubeSVG(shown)}<div class="clues">
          ${c.c.map((t,k)=>k<shown?`<div class="clue"><b>Gợi ý ${k+1}.</b> ${f(t)}</div>`:`<div class="clue locked">Gợi ý ${k+1} đang khoá</div>`).join('')}
        </div></div>
        <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>
        <div class="row">${shown<3&&!fb?`<button class="ghost" id="more">Mở gợi ý ${shown+1} (giảm còn ${3-shown} điểm)</button>`:''}</div>
        <div id="fb">${fb||''}</div>`,`<span class="chip">Ống ${n+1}/${cases.length}</span><span class="chip hot">${pts} điểm</span><span class="chip">Đoán ngay: ${4-shown} điểm</span>`);
      bindBack();
      const more=document.getElementById('more'); if(more)more.onclick=()=>{shown++;draw()};
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const ok=b.dataset.v===c.a;
        app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===c.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
        if(ok){pts+=4-shown;correct++}else miss.push({q:'Ống nghiệm chứa '+c.a,e:c.c.join(' ')});
        shown=3;
        const host=document.getElementById('fb');
        app.querySelector('.clues').innerHTML=c.c.map((t,k)=>`<div class="clue"><b>Gợi ý ${k+1}.</b> ${f(t)}</div>`).join('');
        const mb=document.getElementById('more'); if(mb)mb.remove();
        host.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Đoán đúng!':'Chưa đúng.'}</b>Chất trong ống là ${c.a}.</div>
          <div style="margin-top:12px"><button class="primary" id="nx">${n+1<cases.length?'Ống tiếp theo':'Xem kết quả'}</button></div>`;
        document.getElementById('nx').onclick=()=>{n++;n<cases.length?render():finish('mys',correct,cases.length,`Tổng điểm: ${pts}/${cases.length*3}. Đoán ở gợi ý 1 được 3 điểm.`,miss)};
      });
    }
    draw();
  }
  render();
}

    });
  }
  render();
}


// ---------- bảng xếp hạng (Google Sheets) ----------
const SHEET_DEFAULT='';
let skipName=false;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sheetUrl(){let q='';try{q=new URLSearchParams(location.search).get('bxh')||''}catch(e){}
  return String(q||store.get('sheet','')||SHEET_DEFAULT).trim()}
const player=()=>store.get('player',null);
async function apiGet(params){
  const url=sheetUrl(); const u=url+(url.includes('?')?'&':'?')+new URLSearchParams(params||{}).toString();
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch(u,{signal:ctl.signal,redirect:'follow'});const j=await r.json();if(!j||!j.ok)throw new Error('bad');return j}
  finally{clearTimeout(t)}
}
async function apiPost(body){
  const url=sheetUrl(); const txt=JSON.stringify(body);
  try{const r=await fetch(url,{method:'POST',body:txt,redirect:'follow'});const j=await r.json();if(j&&j.ok===false)return 'rejected';return 'ok'}
  catch(e){await fetch(url,{method:'POST',mode:'no-cors',body:txt});return 'ok'}
}
let flushing=null;
function flush(){
  if(flushing)return flushing;
  flushing=(async()=>{const q=store.get('queue',[]); if(!q.length||!sheetUrl())return 'sent';
    const rest=[]; for(const it of q){try{await apiPost(it)}catch(e){rest.push(it)}}
    store.set('queue',rest); return rest.length?'pending':'sent'})().finally(()=>{flushing=null});
  return flushing;
}
async function submit(mode,correct,total){
  const p=player(); if(!p||!sheetUrl())return 'off';
  if(flushing)await flushing.catch(()=>{});
  const q=store.get('queue',[]); q.push({name:p.name,lop:p.lop,mode,correct,total,t:Date.now()}); store.set('queue',q.slice(-60));
  return flush();
}

function askName(next){
  stopTimer();
  const p=player()||{name:'',lop:''};
  const classes=Object.keys(ROSTER);
  const inList=p.lop&&ROSTER[p.lop]&&ROSTER[p.lop].includes(p.name);
  let manual=!!(p.name&&!inList);
  app.innerHTML=`<div class="panel"><div class="bar"><button class="back" id="back">← Về menu</button></div>
    <h2>Bạn là ai?</h2>
    <p class="lead">Chọn lớp rồi chọn tên của em trong danh sách. Điểm các lần chơi sau sẽ cộng vào cùng một dòng trên bảng xếp hạng.</p>
    <form class="form" id="f">
      <label class="field">Lớp<select id="plop" required><option value="">— Chọn lớp —</option>${classes.map(c=>`<option value="${esc(c)}"${c===p.lop?' selected':''}>${esc(c)}</option>`).join('')}${manual&&p.lop&&!ROSTER[p.lop]?`<option value="${esc(p.lop)}" selected>${esc(p.lop)}</option>`:''}</select></label>
      <label class="field" id="selwrap">Họ và tên<select id="psel"></select></label>
      <label class="field" id="manwrap" hidden>Họ và tên (nhập tay)<input id="pname" maxlength="40" autocomplete="name" value="${esc(manual?p.name:'')}" placeholder="Ví dụ: Nguyễn Văn An"></label>
      <p class="note"><button class="linkbtn" type="button" id="tog"></button></p>
      <p class="note no" id="perr" hidden></p>
      <div class="row"><button class="primary" type="submit">Lưu và chơi</button><button class="ghost" type="button" id="skip">Chơi không lưu điểm</button></div>
    </form></div>`;
  bindBack();
  const cls=document.getElementById('plop'),sel=document.getElementById('psel'),inp=document.getElementById('pname'),
        sw=document.getElementById('selwrap'),mw=document.getElementById('manwrap'),tog=document.getElementById('tog'),er=document.getElementById('perr');
  function fill(){
    const list=ROSTER[cls.value]||[];
    sel.innerHTML=`<option value="">${cls.value?'— Chọn tên —':'— Chọn lớp trước —'}</option>`+list.map((n,i)=>`<option value="${esc(n)}"${n===p.name&&cls.value===p.lop?' selected':''}>${i+1}. ${esc(n)}</option>`).join('');
    sel.disabled=!list.length;
  }
  function view(){sw.hidden=manual;mw.hidden=!manual;
    tog.textContent=manual?'Chọn tên từ danh sách lớp':'Không thấy tên mình? Nhập tay';er.hidden=true}
  cls.onchange=fill; tog.onclick=()=>{manual=!manual;view()};
  fill(); view();
  document.getElementById('f').onsubmit=e=>{e.preventDefault();
    const lop=cls.value.replace(/\s+/g,'').toUpperCase();
    const name=(manual?inp.value:sel.value).replace(/\s+/g,' ').trim();
    if(!lop){er.textContent='Hãy chọn lớp.';er.hidden=false;return}
    if(!manual&&!name){er.textContent='Hãy chọn tên của em trong danh sách.';er.hidden=false;return}
    if(manual&&(name.length<3||!/\s/.test(name))){er.textContent='Hãy nhập đầy đủ họ và tên.';er.hidden=false;return}
    store.set('player',{name,lop}); skipName=false; next();
  };
  document.getElementById('skip').onclick=()=>{skipName=true;next()};
}

function board(){
  stopTimer();
  const url=sheetUrl(), p=player();
  const mode={name:'Bảng xếp hạng lớp'};
  if(!url){
    app.innerHTML=shell(mode,`<p class="lead">Giáo viên chưa kết nối bảng xếp hạng cho game này, nên điểm hiện chỉ lưu trên máy của bạn.</p>
      <button class="ghost" id="gs" style="align-self:flex-start">Tôi là giáo viên: cài đặt ngay</button>`);
    bindBack(); document.getElementById('gs').onclick=setup; return;
  }
  let lop=store.get('lbclass',p?p.lop:'');
  app.innerHTML=shell(mode,`
    <div class="row" style="align-items:flex-end">
      <label class="field" style="min-width:160px">Lớp<select class="inp" id="cls"><option value="">Tất cả các lớp</option>${lop?`<option value="${esc(lop)}" selected>${esc(lop)}</option>`:''}</select></label>
      <button class="ghost" id="reload">Tải lại</button>
    </div>
    <p class="note">Xếp theo tổng số sao (tối đa 18), rồi theo tổng điểm phần trăm tốt nhất của 6 trò chơi (tối đa 600).</p>
    <div id="lbody"><p class="note">Đang tải bảng xếp hạng…</p></div>`);
  bindBack();
  const sel=document.getElementById('cls'), body=document.getElementById('lbody');
  async function load(){
    body.innerHTML='<p class="note">Đang tải bảng xếp hạng…</p>';
    try{
      await flush().catch(()=>{});
      const j=await apiGet(lop?{lop}:{});
      const cur=sel.value;
      const allc=[...new Set([...Object.keys(ROSTER),...(j.classes||[])])];
      sel.innerHTML='<option value="">Tất cả các lớp</option>'+allc.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
      sel.value=allc.includes(cur)?cur:'';
      const list=j.list||[];
      if(!list.length){body.innerHTML='<p class="note">Chưa có ai trên bảng xếp hạng. Hãy chơi một lượt để mở màn!</p>';return}
      const isMe=x=>p&&x.lop===p.lop&&x.name.toLowerCase().replace(/\s+/g,' ')===p.name.toLowerCase();
      const myIdx=list.findIndex(isMe);
      const shown=list.slice(0,50);
      body.innerHTML=`${myIdx>=0?`<p><b>Bạn đang xếp hạng ${myIdx+1}/${j.total||list.length}</b>${lop?` trong lớp ${esc(lop)}`:''}.</p>`:''}
        <div class="lbwrap"><table class="lbt"><thead><tr><th>#</th><th>Học sinh</th><th class="r">Sao</th><th class="r">Điểm</th></tr></thead><tbody>
        ${shown.map((x,i)=>`<tr class="${i<3?'top'+(i+1):''} ${isMe(x)?'mine':''}"><td class="rk">${i+1}</td>
          <td class="nm">${esc(x.name)}<small>Lớp ${esc(x.lop)} · ${Object.keys(x.best||{}).length}/6 trò · ${x.plays} lượt</small></td>
          <td class="r"><b>${x.stars}</b> ★</td><td class="r">${x.points}</td></tr>`).join('')}
        </tbody></table></div>
        ${myIdx>=50?`<p class="note">Bạn ở hạng ${myIdx+1}, ngoài top 50 đang hiển thị.</p>`:''}`;
    }catch(e){
      body.innerHTML='<p class="note no">Không tải được bảng xếp hạng. Kiểm tra kết nối mạng rồi bấm Tải lại.</p>';
    }
  }
  sel.onchange=()=>{lop=sel.value;store.set('lbclass',lop);load()};
  document.getElementById('reload').onclick=load;
  load();
}

function stats(){
  stopTimer();
  const url=sheetUrl(); const mode={name:'Thống kê điểm theo lớp'};
  if(!url){
    app.innerHTML=shell(mode,`<p class="lead">Chưa kết nối Google Sheet nên chưa có dữ liệu để thống kê.</p>
      <button class="ghost" id="gs" style="align-self:flex-start">Cài đặt bảng xếp hạng</button>`);
    bindBack(); document.getElementById('gs').onclick=setup; return;
  }
  const classes=Object.keys(ROSTER);
  let lop=store.get('stclass',classes[0]||'');
  app.innerHTML=shell(mode,`
    <div class="row" style="align-items:flex-end">
      <label class="field" style="min-width:160px">Lớp<select class="inp" id="scls">${classes.map(c=>`<option value="${esc(c)}"${c===lop?' selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <button class="ghost" id="sreload">Tải lại</button>
      <button class="ghost" id="scsv">Tải file CSV</button>
    </div>
    <p class="note">Theo thứ tự trong sổ điểm. Sao: tối đa 18. Điểm: tổng phần trăm tốt nhất của 6 trò (tối đa 600).</p>
    <div id="sbody"><p class="note">Đang tải…</p></div>`);
  bindBack();
  const sel=document.getElementById('scls'), body=document.getElementById('sbody');
  let rows=[];
  const norm=s=>String(s||'').toLowerCase().normalize('NFC').replace(/\s+/g,' ').trim();
  const bv=v=>{if(v==null)return '';if(typeof v==='object')v=v.pct??v.points??v.p??v.stars??'';return v};
  async function load(){
    body.innerHTML='<p class="note">Đang tải…</p>';
    try{
      const j=await apiGet({lop});
      const list=(j.list||[]).filter(x=>String(x.lop).toUpperCase()===lop.toUpperCase());
      const map=new Map(list.map(x=>[norm(x.name),x]));
      const roster=ROSTER[lop]||[], used=new Set();
      rows=roster.map((n,i)=>{const x=map.get(norm(n)); if(x)used.add(norm(n)); return {tt:i+1,name:n,x}});
      const extra=list.filter(x=>!used.has(norm(x.name))).map(x=>({tt:'',name:x.name,x,extra:true}));
      rows=rows.concat(extra);
      const played=rows.filter(r=>r.x&&!r.extra), n=roster.length;
      const avg=k=>played.length?(played.reduce((s,r)=>s+(+r.x[k]||0),0)/played.length).toFixed(1):'–';
      const full=played.filter(r=>Object.keys(r.x.best||{}).length>=MODES.length).length;
      const cell=(r,m)=>{const v=r.x&&r.x.best?bv(r.x.best[m.id]):'';return `<td class="mc">${v===''?'·':esc(v)}</td>`};
      body.innerHTML=`<div class="stsum">
          <span>Đã chơi: <b>${played.length}/${n}</b></span>
          <span>Chưa chơi: <b>${n-played.length}</b></span>
          <span>Chơi đủ 6 trò: <b>${full}</b></span>
          <span>TB sao: <b>${avg('stars')}</b></span>
          <span>TB điểm: <b>${avg('points')}</b></span>
        </div>
        <div class="lbwrap"><table class="lbt"><thead><tr><th>TT</th><th>Học sinh</th>${MODES.map(m=>`<th class="mc" title="${esc(m.name)}">${m.sym}</th>`).join('')}<th class="r">Sao</th><th class="r">Điểm</th><th class="r">Lượt</th></tr></thead><tbody>
        ${rows.map(r=>`<tr class="${r.x?'':'none'}"><td class="tt">${r.tt}</td>
          <td class="nm">${esc(r.name)}${r.extra?'<small>Tên không có trong sổ điểm (nhập tay)</small>':(!r.x?'<small>Chưa chơi</small>':'')}</td>
          ${MODES.map(m=>cell(r,m)).join('')}
          <td class="r">${r.x?`<b>${r.x.stars}</b>`:'–'}</td><td class="r">${r.x?r.x.points:'–'}</td><td class="r">${r.x?r.x.plays:'–'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="note">Kí hiệu cột: ${MODES.map(m=>`${m.sym} = ${esc(m.name)}`).join(' · ')}</p>`;
    }catch(e){rows=[];body.innerHTML='<p class="note no">Không tải được dữ liệu. Kiểm tra kết nối mạng rồi bấm Tải lại.</p>'}
  }
  function csv(){
    if(!rows.length)return;
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const head=['TT','Họ và tên','Lớp',...MODES.map(m=>m.name),'Số trò đã chơi','Sao (/18)','Điểm (/600)','Lượt chơi','Ghi chú'];
    const lines=[head.map(q).join(',')].concat(rows.map(r=>[r.tt,r.name,lop,
      ...MODES.map(m=>r.x&&r.x.best?bv(r.x.best[m.id]):''),
      r.x?Object.keys(r.x.best||{}).length:0, r.x?r.x.stars:'', r.x?r.x.points:'', r.x?r.x.plays:0,
      r.extra?'Tên nhập tay, không có trong sổ':(!r.x?'Chưa chơi':'')].map(q).join(',')));
    const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`ThongKe_Hoa12-GK1_${lop}.csv`; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  }
  sel.onchange=()=>{lop=sel.value;store.set('stclass',lop);load()};
  document.getElementById('sreload').onclick=load;
  document.getElementById('scsv').onclick=csv;
  load();
}

function setup(){
  stopTimer();
  const cur=store.get('sheet','')||SHEET_DEFAULT;
  const mode={name:'Cài đặt bảng xếp hạng'};
  app.innerHTML=shell(mode,`
    <p class="lead">Điểm của học sinh sẽ được ghi vào một Google Sheet của thầy cô. Chỉ cần làm một lần, khoảng 5 phút.</p>
    <ol class="steps">
      <li>Tạo một Google Sheet mới (sheets.new).</li>
      <li>Vào menu <b>Tiện ích mở rộng → Apps Script</b>. Xoá đoạn code có sẵn, dán toàn bộ nội dung file <code>Hoa12-GK1_AppsScript_v3.gs</code>, bấm <b>Lưu</b>.</li>
      <li>Bấm <b>Triển khai → Tùy chọn triển khai mới</b>, chọn loại <b>Ứng dụng web</b>. Đặt <b>Thực thi dưới dạng: Tôi</b> và <b>Người có quyền truy cập: Bất kỳ ai</b>, rồi bấm Triển khai và cấp quyền cho tài khoản Google của thầy cô.</li>
      <li>Sao chép <b>URL ứng dụng web</b> (kết thúc bằng <code>/exec</code>), dán vào ô bên dưới và bấm Kiểm tra.</li>
    </ol>
    <form class="form" id="sf">
      <label class="field">URL ứng dụng web<input id="surl" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cur)}"></label>
      <div class="row"><button class="primary" type="submit">Kiểm tra và lưu</button></div>
      <p class="note" id="sst"></p>
    </form>
    <div id="share"></div>
    <p class="note">URL lưu ở đây chỉ áp dụng cho máy này. Để mọi học sinh dùng chung, hãy gửi học sinh link chia sẻ ở trên (khi game được đưa lên mạng), hoặc gửi URL cho người soạn game để gắn sẵn vào file.</p>`);
  bindBack();
  const showShare=u=>{const box=document.getElementById('share');
    if(!/^https?:/.test(location.protocol)){box.innerHTML='';return}
    const link=location.origin+location.pathname+'?bxh='+encodeURIComponent(u);
    box.innerHTML=`<p class="field">Link gửi học sinh</p><div class="sharebox" id="lnk">${esc(link)}</div><div class="row" style="margin-top:8px"><button class="ghost" id="cp">Sao chép link</button></div>`;
    document.getElementById('cp').onclick=()=>{navigator.clipboard.writeText(link).then(()=>{document.getElementById('cp').textContent='Đã sao chép'}).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('lnk'));const s=getSelection();s.removeAllRanges();s.addRange(r)})};
  };
  if(cur)showShare(cur);
  document.getElementById('sf').onsubmit=async e=>{e.preventDefault();
    const u=document.getElementById('surl').value.trim(), st=document.getElementById('sst');
    if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)){st.textContent='URL chưa đúng. URL ứng dụng web bắt đầu bằng https://script.google.com/ và kết thúc bằng /exec.';st.className='note no';return}
    st.textContent='Đang kiểm tra…';st.className='note';
    const old=store.get('sheet',''); store.set('sheet',u);
    try{const j=await apiGet({});st.textContent=`Kết nối thành công. Bảng hiện có ${j.total||0} học sinh.`;st.className='note ok';showShare(u)}
    catch(err){store.set('sheet',old);st.textContent='Không kết nối được. Kiểm tra lại bước 3 (quyền truy cập phải là "Bất kỳ ai") và kết nối mạng.';st.className='note no'}
  };
}

menu();
flush().catch(()=>{});
})();
